name: Validate & Release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

jobs:
  # ── i18n dictionary consistency ─────────────────────────────────────────────
  # ── every check, one command ───────────────────────────────────────────────
  # The output is one line per check in a fixed order, so a red run names the
  # check id. The report is also written as JSON and uploaded, so two runs can
  # be diffed instead of read side by side.
  i18n:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run every check
        run: python3 tools/audit.py --json audit-report.json

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json

  # ── HACS Validation ──────────────────────────────────────────────────────────
  hacs-validate:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

  # ── Hassfest (HA integration validation) ────────────────────────────────────
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master

  # ── Auto Release when tag is pushed ─────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [i18n, hacs-validate, hassfest]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create release zip
        run: |
          zip -r ha_optimizer.zip custom_components/ha_optimizer/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ha_optimizer.zip
          generate_release_notes: true
          body: |
            ## 🧹 HA Optimizer ${{ github.ref_name }}

            ### Installation via HACS
            1. Add this repository as a custom repository in HACS
            2. Install **HA Optimizer**
            3. Restart Home Assistant
            4. Go to Settings → Devices & Services → Add Integration → HA Optimizer

            ### Manual Installation
            Download `ha_optimizer.zip`, extract and copy `ha_optimizer/` into `config/custom_components/`.
