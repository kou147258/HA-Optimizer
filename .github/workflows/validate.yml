name: Validate & Release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

jobs:
  # ── i18n dictionary consistency ─────────────────────────────────────────────
  i18n:
    name: i18n Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check translation dictionaries
        run: python3 tools/check_i18n.py

      - name: Check version numbers agree
        run: python3 tools/check_version.py

      - name: Purge safety regression tests
        run: python3 tools/test_purge_safety.py

      - name: Panel sync and service registration regression tests
        run: python3 tools/test_panel_sync.py

      - name: Build stamp and cache-busting checks
        run: python3 tools/test_build_stamp.py

      - name: Filter behaviour tests
        run: node tools/test_filters.js

      - name: Trash bulk-operation regression tests
        run: python3 tools/test_trash_bulk.py

      - name: UI label and control-naming checks
        run: python3 tools/test_ui_labels.py

      # Proves the suite above can still fail: each defect the 1.7.2 UI audit
      # found is injected into a copy of the panel and must be caught.
      - name: UI label checks can still fail
        run: node tools/counterproof_ui_labels.js

      - name: Restore-truth regression tests
        run: python3 tools/test_restore_truth.py

      - name: Restore-truth checks can still fail
        run: python3 tools/counterproof_restore.py

      # The live-instance defect: a restore that only edits the registry row
      # never re-instantiates the entity.
      - name: Restore engine behaviour tests
        run: python3 tools/test_restore_engine.py

      # The gate on the only irreversible job, and its counter-proofs.
      - name: Safety gate checks
        run: python3 tools/test_safety_gate.py

      - name: Safety gate checks can still fail
        run: python3 tools/counterproof_safety_gate.py

      - name: Store concurrency and merge checks
        run: python3 tools/test_store_concurrency.py

      - name: Fail-loud checks and whole-file mechanical sweep
        run: python3 tools/test_fail_loud.py

      - name: Compatibility claim checks
        run: python3 tools/test_compat_claims.py

      - name: Live-log regression checks
        run: python3 tools/test_live_log_findings.py

      # v1.7.9 shipped an if/elif block flattened onto one 900-char line: it
      # compiled, every gate passed, and the guard it contained never ran.
      # These check branch structure and line shape, not just key presence.
      - name: Dead-guard and flattened-line checks
        run: python3 tools/test_dead_guard.py

      - name: Dead-guard checks can still fail
        run: python3 tools/counterproof_dead_guard.py

  # ── HACS Validation ──────────────────────────────────────────────────────────
  hacs-validate:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

  # ── Hassfest (HA integration validation) ────────────────────────────────────
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master

  # ── Auto Release when tag is pushed ─────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [i18n, hacs-validate, hassfest]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create release zip
        run: |
          zip -r ha_optimizer.zip custom_components/ha_optimizer/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ha_optimizer.zip
          generate_release_notes: true
          body: |
            ## 🧹 HA Optimizer ${{ github.ref_name }}

            ### Installation via HACS
            1. Add this repository as a custom repository in HACS
            2. Install **HA Optimizer**
            3. Restart Home Assistant
            4. Go to Settings → Devices & Services → Add Integration → HA Optimizer

            ### Manual Installation
            Download `ha_optimizer.zip`, extract and copy `ha_optimizer/` into `config/custom_components/`.
